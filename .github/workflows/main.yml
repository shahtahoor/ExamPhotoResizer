name: Build APK from ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ExamPhotoResizer_Gradle_Project.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ZIP not found at repository root: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/ExamPhotoResizer"

          if [[ ! -f "$PROJECT_DIR/settings.gradle" ]]; then
            echo "Expected extracted/ExamPhotoResizer/settings.gradle"
            find extracted -maxdepth 4 -type f | head -60
            exit 1
          fi

          cp -a "$PROJECT_DIR/." .

      - name: Fix Java/Kotlin JVM target
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle"

          if [[ ! -f "$FILE" ]]; then
            echo "$FILE not found"
            exit 1
          fi

          # Replace common Java 8 target declarations with Java 17.
          sed -i -E \
            's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g;
             s/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g;
             s/VERSION_1_8/VERSION_17/g;
             s/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
            "$FILE"

          # Ensure compileOptions exists inside the Android block.
          if ! grep -q "compileOptions" "$FILE"; then
            sed -i '0,/^android *{/s//android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }/' "$FILE"
          fi

          # Ensure Kotlin targets JVM 17.
          if ! grep -q "kotlinOptions" "$FILE"; then
            sed -i '0,/^android *{/s//android {\n    kotlinOptions {\n        jvmTarget = "17"\n    }/' "$FILE"
          elif ! grep -q "jvmTarget" "$FILE"; then
            sed -i '/kotlinOptions *{/a\        jvmTarget = "17"' "$FILE"
          fi

          echo "---- JVM settings ----"
          grep -n "VERSION_\|jvmTarget\|compileOptions\|kotlinOptions" "$FILE" || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        shell: bash
        run: |
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPhotoResizer-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
