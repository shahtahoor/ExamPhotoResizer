name: Build APK from ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ExamPhotoResizer_Gradle_Project.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ZIP not found at repository root: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/ExamPhotoResizer"

          if [[ ! -f "$PROJECT_DIR/settings.gradle" ]]; then
            echo "Expected extracted/ExamPhotoResizer/settings.gradle"
            find extracted -maxdepth 4 -type f | head -60
            exit 1
          fi

          cp -a "$PROJECT_DIR/." .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPhotoResizer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
